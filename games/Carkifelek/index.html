<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Çarkıfelek</title>

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/animations.css">

  <link rel="stylesheet" href="/components/navbar/navbar.css">
  <link rel="stylesheet" href="/components/footer/footer.css">

  <link rel="stylesheet" href="/games/carkifelek/style.css">

</head>

<body>

  <div id="navbar"></div>

  <section class="game-hero fade-in">

    <div class="container">

      <h1 class="game-title">
        Çarkıfelek
      </h1>

      <p class="game-description">
        Şans çarkı mini oyunu.
      </p>

    </div>

  </section>

  <section class="section">

    <div class="container">

      <div class="wheel-container">

        <div class="wheel-wrapper">

  <div
    class="wheel"
    id="wheel"
  >

    <div class="slice">100</div>
    <div class="slice">200</div>
    <div class="slice">300</div>
    <div class="slice">400</div>

  </div>

</div>

<button
  class="btn btn-primary"
  id="spin-button"
>
  Çarkı Çevir
</button>

<p
  class="wheel-result"
  id="wheel-result"
>
  Sonuç burada görünecek
</p>

      </div>

    </div>

  </section>

  <div id="footer"></div>

  <script src="/js/theme.js"></script>

  <script src="/components/navbar/navbar.js"></script>
  <script src="/components/footer/footer.js"></script>

  <script src="/games/carkifelek/app.js"></script>

</body>

</html>
