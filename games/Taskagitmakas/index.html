<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taş Kağıt Makas</title>

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/animations.css">

  <link rel="stylesheet" href="/components/navbar/navbar.css">
  <link rel="stylesheet" href="/components/footer/footer.css">

  <link rel="stylesheet" href="/games/taskagitmakas/style.css">

</head>

<body>

  <div id="navbar"></div>

  <section class="game-hero fade-in">

    <div class="container">

      <h1 class="game-title">
        Taş Kağıt Makas
      </h1>

      <p class="game-description">
        Bilgisayara karşı oynayın.
      </p>

    </div>

  </section>

  <section class="section">

    <div class="container">

      <div class="choices">

  <!-- ROCK -->

  <button
    class="choice-btn"
    id="rock"
  >
    ✊ Taş
  </button>

  <!-- PAPER -->

  <button
    class="choice-btn"
    id="paper"
  >
    ✋ Kağıt
  </button>

  <!-- SCISSORS -->

  <button
    class="choice-btn"
    id="scissors"
  >
    ✌️ Makas
  </button>

</div>

<!-- COMPUTER -->

<div class="computer-choice">

  Bilgisayar seçimi:
  <span id="computer-choice">
    ?
  </span>

</div>

<!-- RESULT -->

<div
  class="game-result"
  id="game-result"
>
  Seçimini yap
</div>

    </div>

  </section>

  <div id="footer"></div>

  <script src="/js/theme.js"></script>

  <script src="/components/navbar/navbar.js"></script>
  <script src="/components/footer/footer.js"></script>

  <script src="/games/taskagitmakas/app.js"></script>

</body>

</html>
