<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tavla</title>

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/animations.css">

  <link rel="stylesheet" href="/components/navbar/navbar.css">
  <link rel="stylesheet" href="/components/footer/footer.css">

  <link rel="stylesheet" href="/games/tavla/style.css">

</head>

<body>

  <div id="navbar"></div>

  <section class="game-hero fade-in">

    <div class="container">

      <h1 class="game-title">
        Tavla
      </h1>

      <p class="game-description">
        Tavla oyunu altyapısı.
      </p>

    </div>

  </section>

  <section class="section">

    <div class="container">

      <div class="backgammon-layout">

  <!-- PLAYER TOP -->

  <div class="player-panel">

    Oyuncu 2

  </div>

  <!-- BOARD -->

  <div class="board">

    <!-- LEFT SIDE -->

    <div class="board-side">

      <div class="point dark"></div>
      <div class="point light"></div>
      <div class="point dark"></div>
      <div class="point light"></div>
      <div class="point dark"></div>
      <div class="point light"></div>

    </div>

    <!-- CENTER -->

    <div class="board-center"></div>

    <!-- RIGHT SIDE -->

    <div class="board-side">

      <div class="point light"></div>
      <div class="point dark"></div>
      <div class="point light"></div>
      <div class="point dark"></div>
      <div class="point light"></div>
      <div class="point dark"></div>

    </div>

  </div>

  <!-- DICE -->

  <div class="dice-area">

    <div class="dice">⚄</div>

    <div class="dice">⚂</div>

  </div>

  <!-- PLAYER BOTTOM -->

  <div class="player-panel">

    Oyuncu 1

  </div>

</div>

    </div>

  </section>

  <div id="footer"></div>

  <script src="/js/theme.js"></script>

  <script src="/components/navbar/navbar.js"></script>
  <script src="/components/footer/footer.js"></script>

  <script src="/games/tavla/app.js"></script>

</body>

</html>
