<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tetris</title>

  <!-- GLOBAL -->

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/animations.css">

  <!-- COMPONENTS -->

  <link rel="stylesheet" href="/components/navbar/navbar.css">
  <link rel="stylesheet" href="/components/footer/footer.css">

  <!-- PAGE -->

  <link rel="stylesheet" href="/games/tetris/style.css">

</head>

<body>

  <!-- NAVBAR -->

  <div id="navbar"></div>

  <!-- HERO -->

  <section class="game-hero fade-in">

    <div class="container">

      <h1 class="game-title">
        Tetris
      </h1>

      <p class="game-description">

        JavaScript ile geliştirdiğim modern tetris oyunu.

      </p>

    </div>

  </section>

  <!-- GAME AREA -->

  <section class="section">

    <div class="container">

      <div class="game-layout">

        <!-- LEFT -->

        <div class="game-info slide-up">

          <h2>
            Oyun Hakkında
          </h2>

          <p>

            Bu proje modern frontend mimarisi kullanılarak geliştirilmiştir.

          </p>

          <button class="btn btn-primary" id="start-game-btn">
            Oyunu Başlat
          </button>

        </div>

        <!-- RIGHT -->

        <div class="game-preview slide-up"> 
          <canvas
              id="tetris"
              width="300"
              height="600"
              class="hidden"
          ></canvas>

          
        </div>

      </div>

    </div>

  </section>

  <!-- FOOTER -->

  <div id="footer"></div>

  <!-- JS -->

  <script src="/js/theme.js"></script>

  <script src="/components/navbar/navbar.js"></script>
  <script src="/components/footer/footer.js"></script>

  <script src="/games/tetris/app.js"></script>

</body>

</html>
