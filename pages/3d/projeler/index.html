<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Projeler</title>

  <!-- GLOBAL -->

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/search.css">
  <link rel="stylesheet" href="/css/heroes.css">
  <link rel="stylesheet" href="/components/cards/card.css">

  <!-- PAGE -->

  <link rel="stylesheet" href="/css/3d.css">

  <!-- COMPONENTS -->

  <link rel="stylesheet" href="/components/navbar/navbar.css">
  <link rel="stylesheet" href="/components/footer/footer.css">

</head>
<body>
    <div id="navbar"></div>

<section class="page-hero">

  <div class="container">

    <h1 class="page-title">
      3D Projeler
    </h1>

    <p class="page-description">
      Tamamlanan ve devam eden 3D projeler.
    </p>

  </div>

</section>

<section class="section">

  <div class="container">

    <div class="search-container">

      <div class="search-box">

        <label class="search-label">
          Proje Ara <span class="search-count">(0 kayıt)</span>
        </label>

        <div class="search-group">

          <span class="search-icon">
            🔍
          </span>

          <input
            type="text"
            class="search-input"
            placeholder="Proje ara..."
          >

          <span class="search-clear">
            ✕
          </span>

        </div>

      </div>

    </div>

  </div>

</section>
<section class="section">

  <div class="container">

    <div class="card-grid">

      <div class="card">

        <img
          src="/assets/images/3d/infinite-cube.jpg"
          alt="Infinite Cube"
          class="card-image"
        >

        <div class="card-content">

          <h3 class="card-title">
            Infinite Cube
          </h3>

          <p class="card-description">
            PLA malzeme ile hazırlanmış test projesi.
          </p>

          <a href="#" class="btn btn-primary btn-full">
            İncele
          </a>

        </div>

      </div>

      <div class="card">

        <div class="card-content">

          <h3 class="card-title">
            Spiderman Figürü
          </h3>

          <p class="card-description">
            Çok renkli baskı testi.
          </p>

          <a href="#" class="btn btn-primary btn-full">
            İncele
          </a>

        </div>

      </div>

      <div class="card">

        <div class="card-content">

          <h3 class="card-title">
            Satranç Takımı
          </h3>

          <p class="card-description">
            3D yazıcı ile üretilmiş satranç seti.
          </p>

          <a href="#" class="btn btn-primary btn-full">
            İncele
          </a>

        </div>

      </div>

    </div>

  </div>

</section>

<div id="footer"></div>
<script src="/js/theme.js"></script>
<script src="/components/navbar/navbar.js"></script>
<script src="/components/footer/footer.js"></script>
<script src="/js/project-search.js"></script>
</body>
</html>
